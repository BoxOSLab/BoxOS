name: Android
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/boxkernel
      - uses: gradle/actions/setup-gradle@v4
      - run: cargo install cargo-ndk --locked
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :terminal-emulator:testDebugUnitTest :app:lintDebug :app:recordPaparazziDebug
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
      - run: python3 scripts/verify-apk.py
      - run: cargo test --manifest-path vendor/boxkernel/Cargo.toml
      - run: python3 scripts/host-smoke.py --all
      - uses: actions/upload-artifact@v4
        with:
          name: BoxOS-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/
            app/src/test/snapshots/images/
