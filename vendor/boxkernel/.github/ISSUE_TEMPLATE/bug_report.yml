name: Bug report
description: Report a defect or a parity difference vs C PRoot
title: "[bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For **security** issues please use
        [private reporting](https://github.com/BoxOSLab/BoxKernel/security/advisories/new)
        instead — do not post them here.

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: What happened? If it's a parity bug, what does C proot do differently?
      placeholder: A clear description of the problem, including any error output.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands needed to reproduce — minimal is better.
      placeholder: |
        1. proot -r rootfs …
        2. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?

  - type: textarea
    id: verbose
    attributes:
      label: Verbose output
      description: |
        Output of `proot -v 9 <your command>` (or `PROOT_VERBOSE=9`),
        trimmed to the relevant section. Paste inside the code block.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `uname -a`, `proot --version`, and distro.
      placeholder: |
        Linux host 6.8.0 x86_64
        BoxKernel 5.1.0 (commit …)
    validations:
      required: true
