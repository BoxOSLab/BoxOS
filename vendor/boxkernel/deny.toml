# cargo-deny configuration: license, advisory, and dependency hygiene checks.
# Run with: cargo deny check

[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.8
# GPL-2.0-or-later project; dependencies must be permissive. Extend this
# list as new crates are added — the check fails loudly on anything else.
allow = [
    "MIT",
    "Apache-2.0",
]
exceptions = []

# The crate itself is GPL and unpublished (publish = false); skip license
# checks on workspace-private crates.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
