[package]
name = "boxkernel"
version = "5.1.0"
edition = "2024"
rust-version = "1.85"
description = "User-space implementation of chroot, bind mounts and binfmt_misc (clean-room PRoot rewrite in Rust)"
license = "GPL-2.0-or-later"
publish = false

[[bin]]
name = "proot"
path = "src/main.rs"

[lib]
name = "boxkernel"
path = "src/lib.rs"

[dependencies]
libc = "0.2"

[lints.rust]
# This crate is ptrace-heavy; keep unsafe boundaries explicit (the 2024
# edition turns this on by default).
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
# Enforce the default lint set on every build; CI treats warnings as errors.
all = { level = "warn", priority = -1 }
# This codebase deliberately mirrors the C implementation's structure; a
# number of style lints would fight that parity for no correctness gain.
cast_lossless = "allow"
len_without_is_empty = "allow"
missing_safety_doc = "allow"
too_many_arguments = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
